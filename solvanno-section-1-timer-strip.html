<!-- TIMER STRIP
  VARIABLES:
  - Sale label text:   change the text inside the <span> after the emoji
  - Countdown target:  change data-reference="July 4, 2025 11:00:00"
  - Brand color:       change background-color on the outer wrapper div (#9cae01)
-->

<div style="background-color:#9cae01;padding:9px 16px 8px;width:100%;box-sizing:border-box;"
     data-hours="2" data-minutes="29" data-reference="July 4, 2025 11:00:00" id="ts-clock">
  <div style="max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;">

    <!-- Label -->
    <p style="margin:0;font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-size:14px;font-weight:700;color:#1a1a1a;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:5px;">
      <span style="font-size:22px;line-height:1;vertical-align:middle;">🐣</span>
      <span>EASTER SALE ENDS TONGIHT!</span>
    </p>

    <!-- Timer cells -->
    <div style="display:flex;align-items:center;gap:5px;flex-shrink:0;">

      <div style="background:#fff;border-radius:5px;padding:4px 9px;display:flex;align-items:center;gap:4px;">
        <span id="ts-hours" style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:800;color:#1a1a1a;line-height:1;">02</span>
        <span style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-size:10px;font-weight:700;color:#1a1a1a;text-transform:uppercase;letter-spacing:0.5px;line-height:1;">HRS</span>
      </div>

      <div style="background:#fff;border-radius:5px;padding:4px 9px;display:flex;align-items:center;gap:4px;">
        <span id="ts-minutes" style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:800;color:#1a1a1a;line-height:1;">28</span>
        <span style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-size:10px;font-weight:700;color:#1a1a1a;text-transform:uppercase;letter-spacing:0.5px;line-height:1;">MIN</span>
      </div>

      <div style="background:#fff;border-radius:5px;padding:4px 9px;display:flex;align-items:center;gap:4px;">
        <span id="ts-seconds" style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:800;color:#1a1a1a;line-height:1;">38</span>
        <span style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-size:10px;font-weight:700;color:#1a1a1a;text-transform:uppercase;letter-spacing:0.5px;line-height:1;">SEC</span>
      </div>

    </div>
  </div>
</div>

<script>
(function () {
  var clock  = document.getElementById('ts-clock');
  var refStr = clock ? clock.getAttribute('data-reference') : null;
  var end    = refStr ? new Date(refStr).getTime() : 0;

  if (!end || end < Date.now()) {
    var fallbackHours = parseInt((clock && clock.getAttribute('data-hours')) || '2', 10);
    var KEY = 'ts_end_sv';
    end = parseInt(sessionStorage.getItem(KEY) || '0', 10);
    if (!end || end < Date.now()) {
      end = Date.now() + fallbackHours * 3600 * 1000;
      sessionStorage.setItem(KEY, String(end));
    }
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    var diff = Math.max(0, end - Date.now());
    var elH = document.getElementById('ts-hours');
    var elM = document.getElementById('ts-minutes');
    var elS = document.getElementById('ts-seconds');
    if (elH) elH.textContent = pad(Math.floor(diff / 3600000));
    if (elM) elM.textContent = pad(Math.floor((diff % 3600000) / 60000));
    if (elS) elS.textContent = pad(Math.floor((diff % 60000) / 1000));
  }

  tick();
  setInterval(tick, 1000);
})();
</script>
