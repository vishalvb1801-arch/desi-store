<!-- TIMER STRIP
  VARIABLES:
  - Sale label text:   change the text inside #ts-label
  - Countdown target:  change data-reference="July 4, 2025 11:00:00"
  - Brand color:       change background-color on #ts-clock (#9cae01)
-->

<style>
  @media screen and (max-width: 480px) {
    #ts-label      { font-size: 11px !important; gap: 3px !important; }
    #ts-label-emoji { font-size: 17px !important; }
    #ts-cells      { gap: 4px !important; }
    .ts-cell       { padding: 3px 6px !important; }
    .ts-cell-val   { font-size: 13px !important; }
    .ts-cell-unit  { font-size: 9px !important; }
  }
</style>

<div id="ts-clock"
     style="background-color:#9cae01;padding:9px 12px 8px;width:100%;box-sizing:border-box;"
     data-hours="2" data-minutes="29" data-reference="July 4, 2025 11:00:00">
  <div style="max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:nowrap;">

    <!-- Label -->
    <p id="ts-label" style="margin:0;font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-size:14px;font-weight:700;color:#1a1a1a;white-space:nowrap;flex-shrink:1;min-width:0;display:flex;align-items:center;gap:5px;">
      <span id="ts-label-emoji" style="font-size:22px;line-height:1;flex-shrink:0;">🐣</span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">EASTER SALE ENDS TONGIHT!</span>
    </p>

    <!-- Timer cells -->
    <div id="ts-cells" style="display:flex;align-items:center;gap:5px;flex-shrink:0;">

      <div class="ts-cell" style="background:#fff;border-radius:5px;padding:4px 9px;display:flex;align-items:center;gap:4px;">
        <span id="ts-hours" class="ts-cell-val" style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:800;color:#1a1a1a;line-height:1;">02</span>
        <span class="ts-cell-unit" style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-size:10px;font-weight:700;color:#1a1a1a;text-transform:uppercase;letter-spacing:0.5px;line-height:1;">HRS</span>
      </div>

      <div class="ts-cell" style="background:#fff;border-radius:5px;padding:4px 9px;display:flex;align-items:center;gap:4px;">
        <span id="ts-minutes" class="ts-cell-val" style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:800;color:#1a1a1a;line-height:1;">28</span>
        <span class="ts-cell-unit" style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-size:10px;font-weight:700;color:#1a1a1a;text-transform:uppercase;letter-spacing:0.5px;line-height:1;">MIN</span>
      </div>

      <div class="ts-cell" style="background:#fff;border-radius:5px;padding:4px 9px;display:flex;align-items:center;gap:4px;">
        <span id="ts-seconds" class="ts-cell-val" style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:800;color:#1a1a1a;line-height:1;">38</span>
        <span class="ts-cell-unit" style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-size:10px;font-weight:700;color:#1a1a1a;text-transform:uppercase;letter-spacing:0.5px;line-height:1;">SEC</span>
      </div>

    </div>
  </div>
</div>

<script>
(function () {
  var clock  = document.getElementById('ts-clock');
  var refStr = clock ? clock.getAttribute('data-reference') : null;
  var end    = refStr ? new Date(refStr).getTime() : 0;

  if (!end || end < Date.now()) {
    var fallbackHours = parseInt((clock && clock.getAttribute('data-hours')) || '2', 10);
    var KEY = 'ts_end_sv';
    end = parseInt(sessionStorage.getItem(KEY) || '0', 10);
    if (!end || end < Date.now()) {
      end = Date.now() + fallbackHours * 3600 * 1000;
      sessionStorage.setItem(KEY, String(end));
    }
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    var diff = Math.max(0, end - Date.now());
    var elH = document.getElementById('ts-hours');
    var elM = document.getElementById('ts-minutes');
    var elS = document.getElementById('ts-seconds');
    if (elH) elH.textContent = pad(Math.floor(diff / 3600000));
    if (elM) elM.textContent = pad(Math.floor((diff % 3600000) / 60000));
    if (elS) elS.textContent = pad(Math.floor((diff % 60000) / 1000));
  }

  tick();
  setInterval(tick, 1000);
})();
</script>
