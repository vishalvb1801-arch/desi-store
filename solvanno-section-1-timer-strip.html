<!-- TIMER STRIP
  VARIABLES:
  - Sale label text:   change text in the <span> after the emoji
  - Countdown target:  change data-reference="July 4, 2025 11:00:00"
  - Brand color:       change background-color on the outer div (#9cae01)
-->

<div id="ts-clock"
     data-hours="2" data-minutes="29" data-reference="July 4, 2025 11:00:00"
     style="background-color:#9cae01;width:100%;box-sizing:border-box;padding:clamp(7px,1.5vw,9px) clamp(8px,2vw,16px);">
  <div style="max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:clamp(6px,2vw,12px);flex-wrap:nowrap;">

    <!-- Label -->
    <div style="display:flex;align-items:center;gap:clamp(3px,1vw,5px);flex-shrink:1;min-width:0;overflow:hidden;">
      <span style="font-size:clamp(16px,4.5vw,22px);line-height:1;flex-shrink:0;">🐣</span>
      <span style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-size:clamp(9px,2.5vw,14px);font-weight:700;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">EASTER SALE ENDS TONGIHT!</span>
    </div>

    <!-- Timer cells -->
    <div style="display:flex;align-items:center;gap:clamp(3px,1vw,5px);flex-shrink:0;">

      <div style="background:#fff;border-radius:5px;padding:clamp(3px,0.8vw,4px) clamp(5px,1.8vw,9px);display:flex;align-items:center;gap:clamp(2px,0.8vw,4px);">
        <span id="ts-hours" style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-size:clamp(12px,3.2vw,15px);font-weight:800;color:#1a1a1a;line-height:1;">02</span>
        <span style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-size:clamp(8px,2vw,10px);font-weight:700;color:#1a1a1a;text-transform:uppercase;letter-spacing:0.5px;line-height:1;">HRS</span>
      </div>

      <div style="background:#fff;border-radius:5px;padding:clamp(3px,0.8vw,4px) clamp(5px,1.8vw,9px);display:flex;align-items:center;gap:clamp(2px,0.8vw,4px);">
        <span id="ts-minutes" style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-size:clamp(12px,3.2vw,15px);font-weight:800;color:#1a1a1a;line-height:1;">28</span>
        <span style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-size:clamp(8px,2vw,10px);font-weight:700;color:#1a1a1a;text-transform:uppercase;letter-spacing:0.5px;line-height:1;">MIN</span>
      </div>

      <div style="background:#fff;border-radius:5px;padding:clamp(3px,0.8vw,4px) clamp(5px,1.8vw,9px);display:flex;align-items:center;gap:clamp(2px,0.8vw,4px);">
        <span id="ts-seconds" style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-size:clamp(12px,3.2vw,15px);font-weight:800;color:#1a1a1a;line-height:1;">38</span>
        <span style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-size:clamp(8px,2vw,10px);font-weight:700;color:#1a1a1a;text-transform:uppercase;letter-spacing:0.5px;line-height:1;">SEC</span>
      </div>

    </div>
  </div>
</div>

<script>
(function() {
  if (window._svTimerInterval) { clearInterval(window._svTimerInterval); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function getEnd() { var now = new Date(); return new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999); }
  function tick() {
    var diff = getEnd() - Date.now(); if (diff < 0) diff = 0;
    document.getElementById('ts-hours').textContent   = pad(Math.floor(diff / 3600000));
    document.getElementById('ts-minutes').textContent = pad(Math.floor((diff % 3600000) / 60000));
    document.getElementById('ts-seconds').textContent = pad(Math.floor((diff % 60000) / 1000));
  }
  tick();
  window._svTimerInterval = setInterval(tick, 1000);
})();
</script>
