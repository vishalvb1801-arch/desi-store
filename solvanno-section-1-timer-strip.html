<!-- TIMER STRIP
  VARIABLES:
  - Sale label text:   change the text in ts-label-text span
  - Countdown target:  change data-reference="July 4, 2025 11:00:00"
  - Brand color:       change background-color on #ts-clock (#9cae01)
-->

<div id="ts-clock"
     data-hours="2" data-minutes="29" data-reference="July 4, 2025 11:00:00"
     style="background-color:#9cae01;width:100%;box-sizing:border-box;">
  <div id="ts-inner"
       style="max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;">

    <p id="ts-label"
       style="margin:0;font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-weight:700;color:#1a1a1a;white-space:nowrap;flex-shrink:1;min-width:0;display:flex;align-items:center;">
      <span id="ts-emoji" style="line-height:1;flex-shrink:0;">🐣</span>
      <span id="ts-label-text" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">EASTER SALE ENDS TONGIHT!</span>
    </p>

    <div id="ts-cells" style="display:flex;align-items:center;flex-shrink:0;">

      <div class="ts-cell" style="background:#fff;border-radius:5px;display:flex;align-items:center;">
        <span id="ts-hours" class="ts-val" style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-weight:800;color:#1a1a1a;line-height:1;">02</span>
        <span class="ts-unit" style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-weight:700;color:#1a1a1a;text-transform:uppercase;letter-spacing:0.5px;line-height:1;">HRS</span>
      </div>

      <div class="ts-cell" style="background:#fff;border-radius:5px;display:flex;align-items:center;">
        <span id="ts-minutes" class="ts-val" style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-weight:800;color:#1a1a1a;line-height:1;">28</span>
        <span class="ts-unit" style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-weight:700;color:#1a1a1a;text-transform:uppercase;letter-spacing:0.5px;line-height:1;">MIN</span>
      </div>

      <div class="ts-cell" style="background:#fff;border-radius:5px;display:flex;align-items:center;">
        <span id="ts-seconds" class="ts-val" style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-weight:800;color:#1a1a1a;line-height:1;">38</span>
        <span class="ts-unit" style="font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;font-weight:700;color:#1a1a1a;text-transform:uppercase;letter-spacing:0.5px;line-height:1;">SEC</span>
      </div>

    </div>
  </div>
</div>

<script>
(function () {

  /* ── Responsive sizing via JS (bypasses all theme CSS) ── */
  function applySize() {
    var w = window.innerWidth;
    var mobile = w <= 480;

    var clock  = document.getElementById('ts-clock');
    var inner  = document.getElementById('ts-inner');
    var label  = document.getElementById('ts-label');
    var emoji  = document.getElementById('ts-emoji');
    var cells  = document.getElementById('ts-cells');
    var vals   = document.querySelectorAll('.ts-val');
    var units  = document.querySelectorAll('.ts-unit');
    var boxes  = document.querySelectorAll('.ts-cell');

    if (!clock) return;

    /* Wrapper padding */
    clock.style.padding  = mobile ? '7px 10px' : '9px 16px';

    /* Inner gap */
    inner.style.gap = mobile ? '8px' : '12px';

    /* Label */
    label.style.fontSize = mobile ? '11px' : '14px';
    label.style.gap      = mobile ? '3px'  : '6px';

    /* Emoji */
    emoji.style.fontSize = mobile ? '17px' : '22px';

    /* Cell gap */
    cells.style.gap = mobile ? '4px' : '5px';

    /* Each cell box padding */
    for (var i = 0; i < boxes.length; i++) {
      boxes[i].style.padding = mobile ? '3px 6px' : '4px 9px';
      boxes[i].style.gap     = mobile ? '3px'     : '4px';
    }

    /* Value font size */
    for (var j = 0; j < vals.length; j++) {
      vals[j].style.fontSize = mobile ? '13px' : '15px';
    }

    /* Unit font size */
    for (var k = 0; k < units.length; k++) {
      units[k].style.fontSize = mobile ? '9px' : '10px';
    }
  }

  applySize();
  window.addEventListener('resize', applySize);

  /* ── Countdown timer ── */
  var clock  = document.getElementById('ts-clock');
  var refStr = clock ? clock.getAttribute('data-reference') : null;
  var end    = refStr ? new Date(refStr).getTime() : 0;

  if (!end || end < Date.now()) {
    var fallbackHours = parseInt((clock && clock.getAttribute('data-hours')) || '2', 10);
    var KEY = 'ts_end_sv';
    end = parseInt(sessionStorage.getItem(KEY) || '0', 10);
    if (!end || end < Date.now()) {
      end = Date.now() + fallbackHours * 3600 * 1000;
      sessionStorage.setItem(KEY, String(end));
    }
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    var diff = Math.max(0, end - Date.now());
    var elH = document.getElementById('ts-hours');
    var elM = document.getElementById('ts-minutes');
    var elS = document.getElementById('ts-seconds');
    if (elH) elH.textContent = pad(Math.floor(diff / 3600000));
    if (elM) elM.textContent = pad(Math.floor((diff % 3600000) / 60000));
    if (elS) elS.textContent = pad(Math.floor((diff % 60000) / 1000));
  }

  tick();
  setInterval(tick, 1000);

})();
</script>
